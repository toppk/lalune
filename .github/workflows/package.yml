name: Package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm publish --dry-run
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: toppk-lalune-npm-package
          path: toppk-lalune-*.tgz
          if-no-files-found: error
